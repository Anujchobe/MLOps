name: Anuj Lab1 - Python Unittests

on:
  push:
    branches: [main]
    paths:
      - 'Labs/Github_Labs/Lab1_Anuj/**'
      - '.github/workflows/anuj_lab1_unittest.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: Labs/Github_Labs/Lab1_Anuj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unittests
        run: python -m unittest discover -s test -v

      - name: Notify on success
        if: success()
        run: echo "Unit tests passed successfully"

      - name: Notify on failure
        if: failure()
        run: echo "Unit tests failed"
