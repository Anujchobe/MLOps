input {
  file {
    path => "/var/log/auth.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:ts} %{HOSTNAME:log_host} %{DATA:program}(?:\[%{INT:pid}\])?: %{GREEDYDATA:msg}" }
  }
  grok {
    match => { "msg" => "%{WORD:action} password for (invalid user )?%{USERNAME:user} from %{IP:src_ip} port %{INT:src_port}" }
    tag_on_failure => ["not_ssh_auth"]
  }
  date {
    match => [ "ts", "ISO8601" ]
    target => "@timestamp"
  }
  mutate {
    remove_field => [ "ts" ]
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "ssh-auth"
    user => "elastic"
    password => "${ES_PW}"
    ssl_verification_mode => "none"
  }
  stdout { codec => rubydebug }
}
